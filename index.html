<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康銀行｜SREC</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#173f35;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#075942,#27a47b);color:#fff;padding:40px 20px 55px}header>div,main{max-width:900px;margin:auto}h1{font-size:clamp(29px,5vw,45px);margin:10px 0}header p{line-height:1.8;max-width:650px}main{padding:0 18px 40px;margin-top:-26px}.card{background:white;border:1px solid #dbe9df;border-radius:22px;padding:25px;margin-bottom:18px;box-shadow:0 12px 35px #0b493410}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav button{flex:1;min-width:110px}.nav .active{background:#124c3e}button{font:inherit;cursor:pointer;border:0;background:#158462;color:white;border-radius:12px;padding:13px 17px;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.soft{background:#e9f5ee;color:#146c52}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid>.card{margin:0}.muted{color:#61786e;font-size:14px;line-height:1.7}.coins{font-size:clamp(32px,6vw,46px);font-weight:850;color:#087e57}.pill{background:#e6f5ea;color:#11674e;padding:7px 12px;border-radius:100px;font-size:13px;display:inline-block}.choice{display:block;text-align:left;width:100%;background:#f1f7f2;color:#173f35;margin:10px 0;border:2px solid transparent}.choice.sel{border-color:#0e9164;background:#dff6e9}.progress{background:#e2eee7;height:9px;border-radius:20px;overflow:hidden}.progress>div{background:#2bb788;height:100%}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.note{padding:13px 16px;background:#edf8f0;border-left:4px solid #2ca77e;border-radius:8px;line-height:1.7}.history{width:100%;border-collapse:collapse}.history td,.history th{padding:11px;border-bottom:1px solid #e3eee7;text-align:left}.bar{height:13px;background:#e3efe7;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#25a87b}footer{font-size:13px;color:#668075;line-height:1.8;margin:20px 0}@media(max-width:570px){.grid{grid-template-columns:1fr}.card{padding:19px}}
</style></head><body><header><div><div>🌱 SREC · 健康自我探索</div><h1>🏦 健康銀行 Health Bank</h1><p>理財，也要理健康。<br>讓每天的好習慣，累積自己的健康財富。<br><small>每天花一點時間，來了解自己的健康。</small></p></div></header><main><div class="nav"><button id="nav-home" onclick="go('home')">我的健康銀行</button><button id="nav-topics" onclick="go('topics')">健康開戶／存款</button><button id="nav-history" onclick="go('history')">存款紀錄</button></div><div id="app"></div><footer>※ 每完成一份問卷固定獲得 5 枚健康幣，與回答內容無關；健康幣不代表疾病風險、健康程度或醫療診斷。健康狀況不佳不是個人失敗；如有持續、惡化或影響生活的症狀，請尋求專業評估。本 Prototype 資料僅保存在目前瀏覽器。</footer></main><script id="data" type="application/json">{"version":"health-bank.prototype.v4","title":"健康銀行 Health Bank","tagline":"理財，也要理健康。讓每天的好習慣，累積自己的健康財富。","topics":[{"id":"posture","title":"體態與姿勢管理","emoji":"🧘","intro":"從生活習慣觀察肩頸與姿勢狀態","questions":[{"q":"早上起床時，你的肩頸通常感覺如何？","options":["輕鬆自在","有一點僵硬","經常明顯僵硬或不舒服"]},{"q":"工作或使用手機時，你通常如何安排姿勢與休息？","options":["會定期起身活動","想到才偶爾活動","常維持同一姿勢很久"]},{"q":"到了下午，你的肩頸通常會出現什麼狀況？","options":["大多沒有不適","偶爾緊繃或痠痛","經常不適，甚至影響工作"]},{"q":"轉頭或抬高手臂時，你的感覺是？","options":["活動自然順暢","稍微緊繃","疼痛或活動明顯受限"]},{"q":"當肩頸反覆不舒服時，你通常如何應對？","options":["調整姿勢與休息後通常能緩解","偶爾伸展，但不適會再出現","不適反覆影響日常活動"]}],"results":[{"name":"靈活自在探險家","emoji":"🌿","desc":"目前回答顯示日常姿勢與活動相對順暢。維持適度活動與休息習慣。"},{"name":"肩頸硬梆梆機器人","emoji":"🤖","desc":"有些情境已出現緊繃或疲勞，可以留意久坐、螢幕高度與休息頻率。"},{"name":"肩頸過勞警報員","emoji":"🚨","desc":"部分回答顯示不適可能影響生活。若症狀持續、加重或伴隨麻木無力，請尋求醫療評估。"}]},{"id":"strength","title":"肌力與活動能力","emoji":"💪","intro":"看看日常生活中的肌力存款","questions":[{"q":"爬到二樓時，你通常會？","options":["輕鬆完成","有點吃力，但能爬完","需要中途休息","很難爬樓梯"]},{"q":"從椅子站起來時，你通常會？","options":["不扶椅子就能站起來","偶爾需要扶一下","經常需要雙手撐起","需要別人協助"]},{"q":"提約 5 公斤購物袋走一小段路，你覺得？","options":["輕鬆完成","稍微吃力","非常吃力，需要休息","無法完成或不適合嘗試"]},{"q":"過去一年，你跌倒過幾次？","options":["0 次","1 次","2 次以上","不確定"]},{"q":"過去一週，有幾天進行步行或其他身體活動？","options":["5～7 天","3～4 天","1～2 天","0 天"]}],"results":[{"name":"肌力存款充足型","emoji":"🏦","desc":"目前部分日常活動仍能順利完成。持續關注肌力與平衡，養成適合自己的活動習慣。"},{"name":"肌力存款提醒型","emoji":"🪙","desc":"部分活動可能開始吃力。可留意活動能力的變化，必要時請專業人員評估。"},{"name":"肌力存款關注型","emoji":"🪫","desc":"部分日常活動可能有較明顯困難。建議由專業人員評估肌力、平衡及相關原因。"}]},{"id":"home_exercise","title":"居家運動習慣","emoji":"🏃","intro":"了解在家運動的習慣、阻礙與需要的協助","questions":[{"q":"過去一週，你有幾天在家進行運動或身體活動？","options":["5～7 天","3～4 天","1～2 天","0 天"]},{"q":"想在家運動時，你最常遇到什麼困難？","options":["大致知道如何安排","時間不容易安排","不知道適合做哪些運動","擔心疼痛、跌倒或受傷"]},{"q":"在家運動時，你通常如何確認動作是否適合自己？","options":["依照專業人員提供的指引","參考可靠的運動教學","主要憑自己的感覺","不確定動作是否安全"]},{"q":"當運動計畫中斷時，最常見的原因是？","options":["通常能維持習慣","忙碌或忘記","缺少動力或陪伴","身體不適或擔心受傷"]},{"q":"如果有一項服務能幫助你在家持續活動，你最需要什麼？","options":["運動紀錄與進度提醒","簡單清楚的運動安排","有人鼓勵或一起運動","專業人員確認安全與動作"]}],"results":[{"name":"自主運動探索家","emoji":"🌱","desc":"你已經有一些居家活動的方式。可持續觀察自己的習慣，選擇適合身體狀況的活動。"},{"name":"運動習慣養成家","emoji":"🗓️","desc":"在家運動可能遇到時間、規劃或動力上的阻礙。可以從容易執行的小目標開始。"},{"name":"居家運動支援需求者","emoji":"🤝","desc":"你的回答顯示可能需要更多安全指引或支持。若有疼痛、跌倒疑慮或健康限制，先與專業人員討論。"}]},{"id":"home_rehab","title":"居家復健挑戰","emoji":"🏠","intro":"了解在家執行復健計畫時遇到的實際問題","questions":[{"q":"如果醫師或治療師安排居家復健，你最常遇到的情況是？","options":["大致能依計畫完成","偶爾忘記或沒有時間","不確定每個動作怎麼做","目前沒有居家復健計畫"]},{"q":"在家練習復健動作時，你對動作正確性的感受是？","options":["有清楚指引，較有把握","偶爾不確定是否做對","經常不知道動作是否正確","目前沒有進行居家復健"]},{"q":"復健時出現疲勞或不舒服，你通常會怎麼處理？","options":["依照治療師提供的原則調整","先暫停並觀察","不知道該休息或繼續","目前沒有進行居家復健"]},{"q":"在家持續復健，對你來說最大的困難是什麼？","options":["目前沒有明顯困難","缺乏提醒或動力","缺少陪伴或鼓勵","不知道何時增加或降低難度"]},{"q":"如果可以獲得居家復健協助，你最希望增加哪一項？","options":["練習紀錄與進度回顧","動作示範與操作說明","定期有人關心與鼓勵","治療師協助確認動作及調整計畫"]}],"results":[{"name":"居家復健自主實踐者","emoji":"🌟","desc":"你對居家練習的安排已有一些想法。若有正式復健處方，仍應依照醫療團隊指示執行。"},{"name":"復健習慣建立者","emoji":"🧩","desc":"你可能需要更清楚的步驟、提醒或陪伴，協助維持居家練習。"},{"name":"居家復健支援需求者","emoji":"🫶","desc":"你的回答顯示可能需要專業回饋或計畫調整。復健動作及強度應由專業人員依個別狀況指導。"}]}],"rules":{"coins":"完成任一主題的五題問卷，固定獲得 5 枚健康幣，答案不影響金幣。","repeat":"每個主題每天最多記帳一次；可隔日重測，保留每次記錄以追蹤變化。","history":"累積金幣為每次完成問卷固定獲得 5 幣的總和；健康角色與歷次回答供自我觀察。","privacy":"資料僅保存在目前瀏覽器 localStorage；正式上線需建立資料保護及同意機制。"}}</script><script>
const D=JSON.parse(document.getElementById('data').textContent),KEY='srec-health-bank-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{records:[]}}catch(e){state={records:[]}}if(!Array.isArray(state.records))state.records=[];let page='home',topic=0,step=0,answers=[];const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function total(){return state.records.reduce((a,r)=>a+r.coins,0)}function latest(id){return [...state.records].reverse().find(r=>r.topic===id)}function canDeposit(id){return !state.records.some(r=>r.topic===id&&r.date===today())}function go(x){page=x;render()}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+(page==='quiz'||page==='result'?'topics':page)));if(page==='home')home();else if(page==='topics')topics();else if(page==='quiz')quiz();else if(page==='result')result();else history()}function home(){app.innerHTML=`<div class="card"><span class="pill">你的健康財富</span><div class="coins">🪙 ${total().toLocaleString()} 健康幣</div><p class="muted">累計完成 ${state.records.length} 次健康探索 · 已探索 ${new Set(state.records.map(r=>r.topic)).size} / ${D.topics.length} 個主題</p><button onclick="go('topics')">開始健康開戶／存款 →</button></div><div class="card"><h2>健康開戶，就是存下一筆健康財富</h2><p>選擇感興趣的主題 → 回答 5 題 → 完成後固定獲得 5 枚金幣 → 看見專屬健康角色。下次再完成同一主題，就能回顧不同日期的變化。</p><div class="note">每完成一份五題問卷，固定獲得 5 枚金幣，與答案無關。金幣只是趣味化的自我探索回饋，不是正式健康指標。</div></div>`}function topics(){app.innerHTML=`<div class="card"><h2>選擇健康存款主題</h2><p class="muted">每個主題 5 題；同一主題每天最多記帳一次，隔日可再次探索。</p><div class="grid">${D.topics.map((t,i)=>{const last=latest(t.id),ok=canDeposit(t.id);return `<div class="card"><div style="font-size:32px">${t.emoji}</div><h3>${esc(t.title)}</h3><p>${esc(t.intro)}</p>${last?`<p class="muted">上次存款：${last.coins} 幣（${last.date}）</p>`:''}<button ${ok?'':'disabled'} onclick="start(${i})">${ok?'回答 5 題，存入金幣':'今天已完成存款'}</button></div>`}).join('')}</div></div>`}function start(i){topic=i;step=0;answers=[];page='quiz';render()}function choose(i){answers[step]=i;render()}function quiz(){const t=D.topics[topic],q=t.questions[step];app.innerHTML=`<div class="card"><div class="row"><span class="pill">${t.emoji} ${esc(t.title)}</span><b>${step+1} / 5</b></div><div class="progress" style="margin:17px 0"><div style="width:${(step+1)*20}%"></div></div><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="choice ${answers[step]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<div class="row" style="margin-top:22px"><button class="soft" onclick="${step===0?"go('topics')":"step--;render()"}">返回</button><button ${answers[step]===undefined?'disabled':''} onclick="next()">${step===4?'完成健康存款':'下一題 →'}</button></div></div>`}function next(){if(answers[step]===undefined)return;if(step<4){step++;render();return}const t=D.topics[topic];if(!canDeposit(t.id)){go('topics');return}const coins=5;const severity=t.questions.reduce((s,q,i)=>s+answers[i]/Math.max(1,q.options.length-1),0)/t.questions.length;const level=severity>=0.67?2:severity>=0.34?1:0;const record={topic:t.id,date:today(),coins,answers:[...answers],level};state.records.push(record);save();page='result';render()}function result(){const t=D.topics[topic],r=latest(t.id);if(!r){go('topics');return}const v=t.results[r.level];app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:65px">🎉</div><span class="pill">健康存款成功</span><h2>本次存入</h2><div class="coins">+${r.coins} 🪙</div><p class="muted">目前健康銀行總存款：${total().toLocaleString()} 枚金幣</p><hr style="border:0;border-top:1px solid #e3eee7;margin:23px 0"><div style="font-size:50px">${v.emoji}</div><h2>${esc(v.name)}</h2><p>${esc(v.desc)}</p><div class="note" style="text-align:left">金幣及角色是趣味探索回饋，不是疾病診斷或正式健康分級。</div><div class="grid" style="margin-top:20px"><button onclick="go('topics')">探索其他主題</button><button class="soft" onclick="go('history')">查看存款紀錄</button></div></div>`}function history(){const rs=[...state.records].reverse();app.innerHTML=`<div class="card"><h2>📈 健康存款紀錄</h2><p class="muted">每次完成主題的結果都會保留。每次完成固定獲得 5 幣，可查看歷次作答與健康角色；金幣不是臨床量表。</p>${rs.length?`<div style="overflow:auto"><table class="history"><thead><tr><th>日期</th><th>主題</th><th>本次金幣</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${r.date}</td><td>${esc(D.topics.find(t=>t.id===r.topic)?.title||r.topic)}</td><td>🪙 ${r.coins}</td></tr>`).join('')}</tbody></table></div>`:'<p>尚未有存款紀錄。先選擇主題回答 5 題吧！</p>'}${D.topics.map(t=>{const arr=state.records.filter(r=>r.topic===t.id).slice(-8);return arr.length?`<h3>${t.emoji} ${esc(t.title)}</h3>${arr.map(r=>`<div class="row" style="margin:12px 0"><span class="muted">${r.date}</span><div class="bar" style="width:58%"><span style="width:${Math.min(100,r.coins*20)}%"></span></div><b>${r.coins}</b></div>`).join('')}`:''}).join('')}</div><div class="card"><h3>資料管理</h3><p class="muted">目前僅使用本機瀏覽器儲存。清除瀏覽器資料後，紀錄可能遺失。</p><button class="soft" onclick="clearAll()">清除本機示範紀錄</button></div>`}function clearAll(){if(confirm('確定清除所有健康銀行示範紀錄？')){state={records:[]};localStorage.removeItem(KEY);go('home')}}render();
</script></body></html>
